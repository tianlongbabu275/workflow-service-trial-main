<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.FormTitle}}</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }
    .wrap {
      max-width: 560px;
      margin: 48px auto;
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .desc { margin: 0 0 24px; color: #52606d; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 96px; resize: vertical; }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{.FormTitle}}</h1>
    {{if .FormDescription}}<p class="desc">{{.FormDescription}}</p>{{end}}
    <form method="post" action="{{.Action}}">
      {{range .Fields}}
      <div class="field">
        <label for="{{.ID}}">{{.FieldLabel}}{{if .Required}} *{{end}}</label>
        {{if eq .FieldType "textarea"}}
        <textarea id="{{.ID}}" name="{{.FieldLabel}}" {{if .Required}}required{{end}}></textarea>
        {{else if eq .FieldType "dropdown"}}
        <select id="{{.ID}}" name="{{.FieldLabel}}" {{if .Required}}required{{end}} {{if .Multiselect}}multiple{{end}}>
          {{if not .Multiselect}}<option value=""></option>{{end}}
          {{range .Options}}<option value="{{.}}">{{.}}</option>{{end}}
        </select>
        {{else}}
        <input id="{{.ID}}" name="{{.FieldLabel}}" type="{{.InputType}}" {{if .Required}}required{{end}} />
        {{end}}
      </div>
      {{end}}
      <button type="submit">{{.ButtonLabel}}</button>
    </form>
  </div>
</body>
</html>
